<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>On Click Event</title>
    <script>
        function MyFunction()
        {
            document.getElementById('myText').style.display='block';
        }
    </script>
</head>
<body>
     <p id="myText" style="display:none">Hello JavaScript</p>
     <button type="button" onclick="MyFunction()">Click Me</button>
<br>

      <p id="myText1" style="display:none">Hello JavaScript Inline</p>
     <button type="button" onclick="document.getElementById('myText1').style.display='block'">Click Me</button>

</body>
</html>
